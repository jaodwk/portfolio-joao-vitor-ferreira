  <div class="container my-5">
  <h2 class="text-center mb-4">Entre em Contato</h2>
  <p class="text-center mb-5">Tem alguma dúvida ou sugestão? Envie-nos uma mensagem!</p>

  <div class="row justify-content-center">
    <div class="col-lg-8">
      <form>
    
        <div class="mb-3">
          <label for="nome" class="form-label">Nome Completo</label>
          <input type="text" class="form-field form-control" id="nome" placeholder="Escreva o seu nome" required>
        </div>

    
        <div class="mb-3">
          <label for="email" class="form-label">Endereço de E-mail</label>
          <input type="email" class="form-control" id="email" placeholder="nome@exemplo.com" required>
        </div>

     
        <div class="mb-3">
          <label for="assunto" class="form-label">Assunto</label>
          <select class="form-select" id="assunto">
            <option selected>Selecione um assunto</option>
            <option value="duvida">Dúvidas sobre hábitos</option>
            <option value="sugestao">Sugestão de conteúdo</option>
            <option value="outro">Outro assunto</option>
          </select>
        </div>

    
        <div class="mb-3">
          <label for="mensagem" class="form-label">Mensagem</label>
          <textarea class="form-control" id="mensagem" rows="5" placeholder="Escreva aqui a sua mensagem..." required></textarea>
        </div>

     
        <button type="submit" class="btn btn-success w-100">Enviar Mensagem</button>
      </form>
    </div>
  </div>
</div>
