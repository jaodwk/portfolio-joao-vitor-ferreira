        <h2>Fale Conosco</h2>
        
        <label for="nome-contato">Seu Nome:</label>
        <input type="text" id="nome-contato" placeholder="Digite seu nome" required>

        <input type="email" id="email-contato" placeholder="seu@email.com" required>

        <label for="mensagem">Mensagem:</label>
        <textarea id="mensagem" rows="5" placeholder="Como podemos te ajudar?" required></textarea>

        <button type="submit" class="btn-finalizar" style="margin-top: 15px;">Enviar Mensagem</button>
    </form>
